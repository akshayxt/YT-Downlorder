<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT DOWNLOADER</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">

    <style>
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        @keyframes rgb-border {
            0% { border-color: red; }
            25% { border-color: yellow; }
            50% { border-color: green; }
            75% { border-color: blue; }
            100% { border-color: red; }
        }

        @keyframes rgb-line {
            0% { border-color: red; }
            25% { border-color: yellow; }
            50% { border-color: green; }
            75% { border-color: blue; }
            100% { border-color: red; }
        }

        .rgb-line {
            border-width: 2px;
            border-style: solid;
            animation: rgb-line 5s infinite;
        }

        .rgb-option {
            background: linear-gradient(90deg, red, yellow, green, blue, red);
            background-size: 400% 100%;
            animation: rgb-option 5s infinite;
        }

        @keyframes rgb-option {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .rgb-option:hover {
            animation-direction: reverse;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            width: 100%;
            height: 100vh;
            justify-content: center;
            align-items: center;
            display: flex;
            background-color: #1c1524;
        }

        .btn {
            width: 120px;
            font-size: 16px;
            height: 40px;
            border: none;
            outline: none;
            background: black;
            cursor: pointer;
            position: relative;
            border-radius: 10px;
        }

        .words {
            color: white;
            font-size: 1em;
            background-image: none;
            font-weight: bold;
        }

        .btn:hover .words {
            background: linear-gradient(124deg,
                #dd00f3 1%,
                #ff2400,
                #e81d1d,
                #e8b71d,
                #e3e81d,
                #1de840,
                #1ddde8,
                #2b1de8,
                #dd00f3,
                #dd00f3,

                #ff2400,
                #e81d1d,
                #e8b71d,
                #e3e81d,
                #1de840,
                #1ddde8,
                #2b1de8,
                #dd00f3,
                #dd00f3);

            -webkit-background-clip: text;
            -webkit-text-stroke: 2px transparent;
            color: #000;

            animation: glowing 20s linear infinite;
            background-size: 200%;

            opacity: 0;
            transition: opacity 0.3s ease-in-out, color 0.3s ease-in-out;
        }

        .btn:hover .words {
            opacity: 1;
        }

        .btn:before {
            content: "";
            background: linear-gradient(90deg,
                #ff2400,
                #e81d1d,
                #e8b71d,
                #e3e81d,
                #1de840,
                #1ddde8,
                #2b1de8,
                #dd00f3,
                #dd00f3,

                #ff2400,
                #e81d1d,
                #e8b71d,
                #e3e81d,
                #1de840,
                #1ddde8,
                #2b1de8,
                #dd00f3,
                #dd00f3);
            position: absolute;
            top: -2px;
            left: -2px;
            background-size: 200%;
            z-index: -1;
            filter: blur(5px);
            width: calc(100% + 4px);
            height: calc(50% + 4px);
            animation: glowing 20s linear infinite;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            border-top-right-radius: 10px;
            border-top-left-radius: 10px;
        }

        .btn:hover:before {
            opacity: 1;
        }

        .btn:hover.btn:after {
            opacity: 1;
        }

        .btn:after {
            content: "";
            background: linear-gradient(90deg,
                #dd00f3,
                #dd00f3,
                #2b1de8,
                #1ddde8,
                #1de840,
                #e3e81d,
                #e8b71d,
                #e81d1d,
                #ff2400,

                #dd00f3,
                #dd00f3,
                #2b1de8,
                #1ddde8,
                #1de840,
                #e3e81d,
                #e8b71d,
                #e81d1d,
                #ff2400);
            position: absolute;
            top: calc(50% - 2px);
            left: -2px;
            background-size: 200%;
            z-index: -1;
            filter: blur(5px);
            width: calc(100% + 4px);
            height: calc(50% + 4px);
            animation: glowing-reverse 20s linear infinite;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
        }

        @keyframes glowing {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 400% 0;
            }
        }

        @keyframes glowing-reverse {
            0% {
                background-position: 400% 0;
            }

            100% {
                background-position: 0 0;
            }
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen relative">

    <video autoplay muted loop class="absolute inset-0 w-full h-full object-cover z-0">
        <source src="https://static.moewalls.com/videos/preview/2023/sung-jinwoo-shadow-monarch-solo-leveling-preview.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div class="absolute top-0 w-full bg-black bg-opacity-50 text-white py-2 z-10">
        <div class="whitespace-nowrap overflow-hidden">
            <div class="inline-block animate-marquee" style="animation: marquee 15s linear infinite;">
                This is a sample project.
            </div>
        </div>
    </div>

    <button id="menu-button" class="absolute top-4 left-4 text-white z-20">
        <i class="fas fa-bars fa-2x"></i>
    </button>

    <div id="slide-menu" class="fixed top-0 left-0 w-full h-full bg-white bg-opacity-75 flex items-center justify-center z-20 hidden">
        <div class="bg-white p-8 rounded-lg shadow-md relative">
            <div class="flex flex-col items-center">
                <a href="#" target="_blank" class="mb-4 text-blue-600">
                    <i class="fab fa-facebook fa-2x"></i> facebook
                </a>
                <a href="#" class="mb-4 text-gray-800"><i class="fab fa-github fa-2x"></i> GitHub</a>
                <a href="#" class="mb-4 text-pink-600"><i class="fab fa-instagram fa-2x"></i> Instagram</a>
            </div>
        </div>
    </div>

    <div class="bg-gray-800 p-8 rounded-lg shadow-md w-full max-w-md z-10 relative">
        <div class="flex justify-center mb-4 space-x-4">
            <div class="bg-gray-700 p-2 rounded-lg shadow-md">
                <button id="youtube-button" class="btn">
                    <span class="words">YouTube</span>
                </button>
            </div>
            <div class="bg-gray-700 p-2 rounded-lg shadow-md">
                <button id="instagram-button" class="btn">
                    <span class="words">Instagram</span>
                </button>
            </div>
        </div>
        <div id="youtube-container" class="hidden">
            <h1 class="text-2xl font-bold text-center mb-4 text-white">YouTube Playlist Downloader</h1>
            <form>
                <div class="mb-4">
                    <label for="download-as" class="block text-gray-300">Download as:</label>
                    <select id="download-as" class="w-full p-2 border border-gray-300 rounded mt-1 rgb-option">
                        <option class="rgb-option">Audio (M4A)</option>
                        <option class="rgb-option">Video (MP4)</option>
                    </select>
                </div>
                <hr class="mb-4 border-gray-600 rgb-line">
                <h2 class="text-xl font-bold text-center mb-4 text-white">Download via Python Script</h2>
                <div class="mb-4">
                    <label for="video-url" class="block text-gray-300">Enter video URL:</label>
                    <input type="text" id="video-url" placeholder="Enter video URL" class="w-full p-2 border border-gray-300 rounded mt-1">
                </div>
                <div class="text-center">
                    <button id="download-button" type="button" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                        Download
                    </button>
                    <div id="download-status" class="text-center mt-2 text-gray-300"></div>
                </div>
            </form>
        </div>
        <div id="instagram-container" class="hidden">
            <h1 class="text-2xl font-bold text-center mb-4 text-white">Instagram Reel Downloader</h1>
            <form>
                <div class="mb-4">
                    <label for="reel-url" class="block text-gray-300">Enter reel URL:</label>
                    <input type="text" id="reel-url" placeholder="Enter reel URL" class="w-full p-2 border border-gray-300 rounded mt-1">
                </div>
                <div class="text-center">
                    <button id="reel-download-button" type="button" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                        Download
                    </button>
                    <div id="reel-download-status" class="text-center mt-2 text-gray-300"></div>
                </div>
            </form>
        </div>
    </div>

    <div class="bg-gray-700 p-8 rounded-lg shadow-lg text-center text-white ml-8 z-10 relative">
        <h2 class="text-xl font-bold mb-4">Feedback Box</h2>
        <form id="feedback-form">
            <div class="mb-4">
                <input type="text" id="name" placeholder="Name" class="w-full p-2 rounded bg-gray-400 text-black mb-2">
                <input type="text" id="surname" placeholder="Surname" class="w-full p-2 rounded bg-gray-400 text-black">
            </div>
            <div class="mb-4">
                <input type="email" id="email" placeholder="Email Id" class="w-full p-2 rounded bg-gray-400 text-black">
            </div>
            <div class="mb-4">
                <textarea id="query" placeholder="Your Query" class="w-full p-2 rounded bg-gray-400 text-black"></textarea>
            </div>
            <button id="send-button" type="button" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Send</button>
        </form>
    </div>

    <script>
        document.getElementById('menu-button').addEventListener('click', function() {
            document.getElementById('slide-menu').classList.remove('hidden');
        });

        document.getElementById('slide-menu').addEventListener('click', function(event) {
            if (event.target === this) {
                document.getElementById('slide-menu').classList.add('hidden');
            }
        });

        document.getElementById('youtube-button').addEventListener('click', function() {
            document.getElementById('youtube-container').classList.remove('hidden');
            document.getElementById('instagram-container').classList.add('hidden');
        });

        document.getElementById('instagram-button').addEventListener('click', function() {
            document.getElementById('instagram-container').classList.remove('hidden');
            document.getElementById('youtube-container').classList.add('hidden');
        });

        document.getElementById('download-button').addEventListener('click', function() {
            const videoUrl = document.getElementById('video-url').value.trim();
            const downloadType = document.getElementById('download-as').value.toLowerCase().includes("audio") ? "audio" : "video";
            const statusDiv = document.getElementById('download-status');

            if (!videoUrl) {
                statusDiv.textContent = "Please enter a video URL!";
                statusDiv.classList.add("text-red-500");
                return;
            }

            statusDiv.textContent = "Downloading...";
            statusDiv.classList.remove("text-red-500");
            statusDiv.classList.add("text-blue-500");

            fetch('/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ "video-url": videoUrl, "download-as": downloadType })
            })
            .then(response => response.json())
            .then(data => {
                statusDiv.textContent = data.output;
                statusDiv.classList.add("text-green-500");
            })
            .catch(error => {
                statusDiv.textContent = "Download failed!";
                statusDiv.classList.add("text-red-500");
            });
        });

        document.getElementById('reel-download-button').addEventListener('click', function() {
            const reelUrl = document.getElementById('reel-url').value.trim();
            const statusDiv = document.getElementById('reel-download-status');

            if (!reelUrl) {
                statusDiv.textContent = "Please enter a reel URL!";
                statusDiv.classList.add("text-red-500");
                return;
            }

            statusDiv.textContent = "Downloading...";
            statusDiv.classList.remove("text-red-500");
            statusDiv.classList.add("text-blue-500");

            fetch('/download-reel', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ "reel-url": reelUrl })
            })
            .then(response => response.json())
            .then(data => {
                statusDiv.textContent = data.output;
                statusDiv.classList.add("text-green-500");
            })
            .catch(error => {
                statusDiv.textContent = "Download failed!";
                statusDiv.classList.add("text-red-500");
            });
        });

        document.getElementById('send-button').addEventListener('click', function() {
            const name = document.getElementById('name').value.trim();
            const surname = document.getElementById('surname').value.trim();
            const email = document.getElementById('email').value.trim();
            const query = document.getElementById('query').value.trim();

            if (!name || !surname || !email || !query) {
                alert("Please fill in all fields.");
                return;
            }

            fetch('/feed', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, surname, email, query })
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
            })
            .catch(error => {
                alert("Failed to send feedback.");
            });
        });
    </script>

</body>
</html>
